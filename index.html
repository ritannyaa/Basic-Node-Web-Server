<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Node.js Web Server</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 45px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 Node.js Web Server</h1>

        <p>
            Welcome! This webpage is being served
            using a basic Node.js HTTP server.
        </p>

        <div class="status">
            ● Server is Running
        </div>

    </div>

</body>

</html>
